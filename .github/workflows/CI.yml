name: CI

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # Main suite: pure Julia, no external dependencies. Fast, runs everywhere.
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy documentation
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Correctness cross-validation against the R reference implementations.
  # Separate job because installing nadiv + sommer is slow; Linux only, since
  # the point is the numerical comparison, not platform coverage.
  external:
    name: Cross-validate vs R (nadiv, sommer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # RSPM serves Linux binaries, so this is minutes rather than a source build.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::nadiv
            any::sommer
            any::Matrix

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2

      - name: Instantiate external test environment
        run: |
          julia --project=test/external -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Cross-validate against R
        run: julia --project=test/external test/external/runtests_external.jl

  # Speed comparison. Not a pass/fail gate -- timings on shared CI runners are
  # too noisy for that -- but it publishes the table as a job summary so the
  # numbers in the README can be re-checked.
  benchmark:
    name: Speed vs R (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::nadiv
            any::sommer
            any::Matrix
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate bench environment
        run: |
          julia --project=bench -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run comparison
        run: |
          {
            echo '## Speed vs R (nadiv, sommer)'
            echo '```'
            julia --project=bench bench/external.jl 2>&1 | grep -vE 'Warning|Dams appearing|numPed|built under'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
